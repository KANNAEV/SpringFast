<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"> <!--/* Определяем префикс th, чтобы использовать  Thymeleaf */-->
<head>
    <meta charset="UTF-8">
    <title>Home Page</title>
</head>
<body>
<h1>Products</h1>
<h2>View products</h2>

<table border="">
    <tr>
        <!--Даем таблице статический заголовок-->
        <th>PRODUCT NAME</th>
        <th>PRODUCT PRICE</th>
    </tr>
    <!--    Используем функцию Thymeleaf th:each, чтобы выполнить итерации
            по всей коллекции товаров и вывести строку таблицы для каждого товара в списке-->
    <tr th:each="p: ${products}">
        <!-- В каждой строке таблицы выводим наименование и цену товара-->
        <td th:text="${p.name}"></td>
        <td th:text="${p.price}"></td>
    </tr>
</table>

<h2>Add a product</h2>
<form action="/products" method="post">
    <!--    Данный компонент <input> позволяет пользователю ввести наименование товара.
            Значение этого компонента передается в виде параметра запроса с ключом name-->
    Name: <input type="text" name="name"><br/>
    <!--    Данный компонент <input> позволяет пользователю ввести цену товара.
    Значение этого компонента передается в виде параметра запроса с ключом price-->
    Price: <input type="number" step="any" name="price"><br/>
    <!--    Эта кнопка позволяет пользователю отправить форму-->
    <button type="submit">Add product</button>
</form>
</body>
</html>
